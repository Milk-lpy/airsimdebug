name: Build public unsigned AirSIM iOS 196
on:
  workflow_dispatch:
  push:
    branches: [main, feature/ios-195-carrier]
    paths:
      - 'ios-client/iOS/**'
      - '.github/workflows/build-ios-196.yml'

permissions:
  contents: write

concurrency:
  group: public-ios-196
  cancel-in-progress: true

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IPA: AirSIM-iOS-0.9.9-build196-Sandbox-full-unsigned.ipa
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Compile iPhone, extensions and Watch
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk watchos --show-sdk-version
          xcodebuild -project ios-client/iOS/AirSIM.xcodeproj -scheme AirSIM -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AirSIM.xcarchive" \
            MARKETING_VERSION=0.9.9 CURRENT_PROJECT_VERSION=196 \
            APS_ENVIRONMENT=development AIRSIM_APNS_ENVIRONMENT=sandbox AIRSIM_PUSH_RELAY_URL= AIRSIM_WIDEBAND_TRIAL_AGENT_ID= \
            CODE_SIGNING_ALLOWED=NO archive
          sh ios-client/iOS/scripts/package-unsigned.sh "$RUNNER_TEMP/AirSIM.xcarchive" "$RUNNER_TEMP/$IPA" full
      - name: Verify the public package
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ios196-check"
          ditto -xk "$RUNNER_TEMP/$IPA" "$RUNNER_TEMP/ios196-check"
          cd "$RUNNER_TEMP/ios196-check"
          main=Payload/AirSIM.app
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          app = Path('Payload/AirSIM.app')
          components = {app, app/'PlugIns/AirSIMLiveActivityExtension.appex',
                        app/'PlugIns/AirSIMNotificationService.appex',app/'Watch/AirSIMWatchApp.app'}
          assert {f.parent for f in app.rglob('Info.plist') if f.parent.suffix in ('.app','.appex')} == components
          for bundle in components:
              info = plistlib.loads((bundle/'Info.plist').read_bytes())
              assert info['CFBundleVersion'] == '196' and info['CFBundleShortVersionString'] == '0.9.9'
              assert (bundle / info['CFBundleExecutable']).is_file()
              if bundle == app:
                  assert info['AirSIMAPNSEnvironment'] == 'sandbox'
                  assert not info.get('AirSIMPushRelayURL')
                  assert not info.get('AirSIMVoWLANWidebandTrialAgentID')
          assert not list(app.rglob('_CodeSignature')) and not list(app.rglob('*.mobileprovision'))
          PY
          count=0
          while IFS= read -r -d '' file; do
            kind=$(file -b "$file")
            case "$kind" in *Mach-O*) ;; *) continue ;; esac
            count=$((count+1))
            xcrun otool -arch all -l "$file" > "$RUNNER_TEMP/ios196-load-commands"
            if grep -q 'cmd LC_CODE_SIGNATURE' "$RUNNER_TEMP/ios196-load-commands"; then
              echo "::error::Signed Mach-O in $file"
              exit 1
            fi
          done < <(find "$main" -type f -print0)
          test "$count" -ge 4
          xcrun otool -l "$main/AirSIM" > "$RUNNER_TEMP/main-loads"
          python3 - "$RUNNER_TEMP/main-loads" <<'PYCODE'
          import re, sys
          data = open(sys.argv[1]).read()
          for name in ('LiveCommunicationKit', 'TelephonyMessagingKit'):
              assert any('cmd LC_LOAD_WEAK_DYLIB' in part and '/'+name+'.framework/' in part for part in re.split(r'Load command \d+\n', data)), name
          PYCODE
          shasum -a 256 "$RUNNER_TEMP/$IPA"
      - name: Retain a downloadable copy of the verified IPA
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        continue-on-error: true
        with:
          name: AirSIM-iOS-196-unsigned
          path: ${{ runner.temp }}/${{ env.IPA }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Publish the verified build to the build branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p binaries/ios
          cp "$RUNNER_TEMP/$IPA" "binaries/ios/$IPA"
          (cd binaries/ios && shasum -a 256 "$IPA" > "$IPA.sha256")
          git add -- "binaries/ios/$IPA" "binaries/ios/$IPA.sha256"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish verified unsigned iOS 0.9.9 (196) Sandbox build'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
  carrier-tests:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Test the offline export with synthetic history
        run: python3 -m unittest discover -s ios-client/tools -p 'test_*.py'
      - name: Test routes, history and the device-local mailbox
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, rows in sorted(devices.items(), reverse=True) if ".iOS-" in runtime for d in rows if d["name"].startswith("iPhone")))')
          xcodebuild test -project ios-client/iOS/AirSIM.xcodeproj -scheme AirSIM \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -only-testing:AirSIMTests/CallbackSIMDialChoiceTests -only-testing:AirSIMTests/ExternalDialHandoffTests \
            -only-testing:AirSIMTests/SystemCallHistoryTests -only-testing:AirSIMTests/IPhoneMailboxTests -only-testing:AirSIMTests/IPhoneMMSGroupTests
